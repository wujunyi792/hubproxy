name: ghcr镜像构建

# main 有改动就发 latest。原先只有打 tag 才构建，导致 982c5f8 修好的
# docker.io upstream 映射两个月没进镜像，线上一直返回 502。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/demo/**'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)，留空则按分支/标签自动推导'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test          # 测试不过就不发布，避免再把半成品推上 latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="main-${SHORT_SHA}"
          fi

          # latest 始终指向最新构建；另外保留一个不可变标签便于回滚
          TAGS="--tag ghcr.io/${REPO_LOWER}:${VERSION} --tag ghcr.io/${REPO_LOWER}:latest"

          echo "VERSION=$VERSION"   >> $GITHUB_ENV
          echo "TAGS=$TAGS"         >> $GITHUB_ENV
          echo "本次标签: ${VERSION}, latest"

      - name: Build and push Docker image
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            ${TAGS} \
            --build-arg VERSION=${VERSION} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f Dockerfile .

      - name: 输出结果
        run: |
          echo "已发布 ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${VERSION}"
          echo "commit ${GITHUB_SHA}"
